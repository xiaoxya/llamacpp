[project]
name = "llamacpp"
version = "2.0.0"
description = "Arch Linux 双 NVIDIA GPU llama.cpp 部署与管理器（Python 版）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "llamacpp contributors" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "rich>=13",
]

[project.scripts]
llamacpp = "llamacpp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llamacpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
