<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}llamacpp 面板{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --bg:#12161d; --card:#1a2029; --line:#2a323e; --text:#dde3ea;
            --muted:#8a93a2; --accent:#4f9cf9; --ok:#3fb96f; --bad:#e0565b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:14px/1.6 system-ui,"Noto Sans SC",sans-serif; }
    .wrap { display:flex; min-height:100vh; }
    nav { width:180px; background:var(--card); border-right:1px solid var(--line);
          padding:18px 12px; flex-shrink:0; }
    nav h1 { font-size:15px; margin:0 0 16px; color:var(--accent); }
    nav a { display:block; padding:7px 10px; border-radius:6px; color:var(--text);
            text-decoration:none; margin-bottom:2px; }
    nav a:hover, nav a.active { background:var(--line); }
    main { flex:1; padding:22px 28px; max-width:960px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
            padding:14px 18px; margin-bottom:16px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .pill { padding:2px 10px; border-radius:999px; font-size:12px; }
    .pill.ok  { background:#123826; color:var(--ok); }
    .pill.bad { background:#3a1719; color:var(--bad); }
    button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px;
                   padding:7px 16px; cursor:pointer; text-decoration:none; font-size:13px; }
    button.warn { background:#c7842a; } button.danger { background:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:normal; }
    input[type=text], input[type=password] {
      background:var(--bg); border:1px solid var(--line); color:var(--text);
      border-radius:6px; padding:6px 9px; width:100%; }
    .grid2 { display:grid; grid-template-columns:170px 1fr; gap:6px 12px; }
    .muted { color:var(--muted); } .spark { width:100%; height:80px; display:block; }
    label.cfg { display:flex; gap:10px; align-items:center; padding:2px 0; }
    label.cfg span:first-child { width:190px; color:var(--muted); flex-shrink:0; }
  </style>
</head>
<body>
<div class="wrap">
  <nav>
    <h1>llamacpp</h1>
    <a href="/">仪表盘</a>
    <a href="/models">模型</a>
    <a href="/profiles">Profile</a>
    <a href="/config">配置</a>
    <a href="/alerts">告警</a>
    {% if panel_key_enabled %}<a href="/logout">退出登录</a>{% endif %}
  </nav>
  <main>{% block content %}{% endblock %}</main>
</div>
</body>
</html>
