{% extends "base.html" %}
{% block title %}登录 · llamacpp{% endblock %}
{% block head %}
<style>
  body { display: grid; place-items: center; }
  .login-card {
    width: min(400px, 92vw); text-align: center; position: relative;
    background: var(--card); backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 18px; padding: 44px 38px 38px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), 0 0 60px rgba(34, 211, 238, 0.07);
  }
  .login-ring {
    width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 18px;
    padding: 2px; background: conic-gradient(from 180deg, #22d3ee, #a78bfa, #22d3ee);
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-mark {
    width: 100%; height: 100%; border-radius: 16px; background: var(--card-solid);
    display: grid; place-items: center; font-weight: 800; font-size: 24px;
    background-image: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  h1 { font-size: 19px; font-weight: 650; margin: 0 0 6px; letter-spacing: .4px; }
  .login-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 26px; }
  .err {
    color: var(--bad); font-size: 12.5px; margin: 0 0 14px;
    border: 1px solid rgba(251,113,133,.35); background: rgba(251,113,133,.08);
    border-radius: 8px; padding: 7px 12px; animation: shake .35s ease;
  }
  @keyframes shake { 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  .login-btn { width: 100%; margin-top: 16px; padding: 10px; font-size: 14px; }
</style>
{% endblock %}
{% block content %}
<div class="login-card">
  <div class="login-ring"><div class="login-mark">L</div></div>
  <h1>llamacpp 控制台</h1>
  <p class="login-sub">双卡推理管理面板 · 请输入访问密钥</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="key" placeholder="Access Key" autofocus autocomplete="off">
    <button class="login-btn">解 锁</button>
  </form>
</div>
{% endblock %}
