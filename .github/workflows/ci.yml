name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning llamacpp.sh
          bash -n llamacpp.sh tests/unit.bash

  test-bash:
    name: Tests (Bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash unit tests
        run: bash tests/unit.bash

  test-python:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install typer pydantic rich pytest fastapi uvicorn jinja2 httpx python-multipart
      - name: Run pytest
        run: PYTHONPATH=src python -m pytest
